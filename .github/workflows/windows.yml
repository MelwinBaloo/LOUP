name: Application Windows

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adresse du serveur de jeu intégrée par défaut (optionnel)"
        required: false
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Adresse du serveur par défaut
        if: ${{ inputs.server_url != '' }}
        shell: bash
        run: sed -i "s#process.env.LOUP_SERVER_URL || ''#process.env.LOUP_SERVER_URL || '${{ inputs.server_url }}'#" main.js
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Loup-Garou-Setup
          path: desktop/dist/*.exe
