<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loup-Garou en ligne</title>
  <meta name="description" content="Jouez au Loup-Garou entre amis avec chat vocal, sur navigateur, smartphone et Windows.">
  <meta name="theme-color" content="#0f1226">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dusk">
  <div class="sky" aria-hidden="true">
    <div class="sky-layer sky-dusk"></div>
    <div class="sky-layer sky-night"></div>
    <div class="sky-layer sky-day"></div>
    <div class="glow"></div>
    <div class="stars" id="stars"></div>
    <div class="shooting"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="fog"></div>
    <svg class="village" viewBox="0 0 1200 140" preserveAspectRatio="xMidYMax slice">
      <g class="hill">
        <path d="M0 110 Q150 70 320 100 T640 92 T960 104 T1200 88 V140 H0 Z"/>
        <!-- Sapins -->
        <path d="M40 112 l18 -46 l18 46 z M70 108 l14 -34 l14 34 z M1110 100 l20 -52 l20 52 z M1145 104 l14 -36 l14 36 z M560 98 l12 -30 l12 30 z"/>
        <!-- Maisons -->
        <path d="M140 108 v-34 l26 -20 l26 20 v34 z"/>
        <path d="M230 106 v-28 l22 -17 l22 17 v28 z"/>
        <path d="M400 104 v-40 l30 -24 l30 24 v40 z"/>
        <!-- Église -->
        <path d="M640 100 v-44 l34 -26 l34 26 v44 z M664 40 v-22 h20 v22 z M672 18 v-14 h4 v14 z M667 9 h14 v3 h-14 z"/>
        <path d="M760 104 v-30 l24 -18 l24 18 v30 z"/>
        <path d="M880 106 v-36 l28 -21 l28 21 v36 z"/>
        <path d="M990 104 v-26 l20 -15 l20 15 v26 z"/>
      </g>
      <g>
        <rect class="win lit" x="150" y="82" width="9" height="10"/>
        <rect class="win" x="173" y="82" width="9" height="10"/>
        <rect class="win lit" x="246" y="84" width="10" height="9"/>
        <rect class="win lit" x="412" y="72" width="10" height="11"/>
        <rect class="win" x="438" y="72" width="10" height="11"/>
        <rect class="win lit" x="424" y="90" width="10" height="11"/>
        <rect class="win lit" x="668" y="68" width="12" height="18" rx="6"/>
        <rect class="win lit" x="777" y="82" width="10" height="10"/>
        <rect class="win" x="893" y="80" width="10" height="11"/>
        <rect class="win lit" x="913" y="80" width="10" height="11"/>
        <rect class="win lit" x="1004" y="86" width="9" height="9"/>
      </g>
    </svg>
  </div>
  <div id="phase-transition" class="phase-transition" aria-hidden="true">
    <div><div class="pt-icon"></div><div class="pt-text"></div><div class="pt-sub"></div></div>
  </div>

  <!-- Accueil -->
  <main id="home" class="screen">
    <div class="home-card">
      <img src="icons/icon.svg" alt="" class="logo">
      <h1>Loup-Garou</h1>
      <p class="tagline">Le village s'endort… avec le chat vocal.</p>

      <label for="name">Ton pseudo</label>
      <input id="name" maxlength="20" autocomplete="nickname" placeholder="ex : Marie">

      <button id="create" class="btn primary">Créer une partie</button>

      <div class="divider"><span>ou</span></div>

      <label for="code">Code de la partie</label>
      <div class="row">
        <input id="code" maxlength="5" placeholder="ABCDE" autocapitalize="characters" autocomplete="off">
        <button id="join" class="btn">Rejoindre</button>
      </div>
      <p id="home-error" class="error" role="alert"></p>
      <button id="install" class="btn ghost hidden">📲 Installer l'application</button>
    </div>
  </main>

  <!-- Partie -->
  <main id="game" class="screen hidden">
    <header class="topbar">
      <button id="leave" class="icon-btn" title="Quitter">←</button>
      <div class="phase">
        <div id="phase-label">Salon</div>
        <div id="timer" class="timer"></div>
      </div>
      <button id="share" class="code-pill" title="Inviter des amis">#<span id="room-code"></span></button>
    </header>

    <div class="layout">
      <section class="board">
        <div id="role-card" class="role-card hidden"></div>
        <div id="prompt" class="prompt"></div>
        <div id="players" class="players"></div>
        <div id="controls" class="controls"></div>
      </section>

      <aside class="side">
        <div class="tabs">
          <button class="tab active" data-tab="chat">💬 Chat</button>
          <button class="tab" data-tab="notes">📝 Calepin</button>
          <button class="tab" data-tab="log">📜 Journal</button>
        </div>
        <div id="tab-chat" class="tab-panel">
          <ul id="chat" class="feed"></ul>
          <form id="chat-form" class="chat-form">
            <input id="chat-input" maxlength="300" placeholder="Écrire un message…" autocomplete="off">
            <button class="btn small">Envoyer</button>
          </form>
        </div>
        <div id="tab-notes" class="tab-panel hidden">
          <div class="notes">
            <p class="notes-help">Visible par toi seul. Marque tes soupçons, ils s'affichent sur les cartes des joueurs.</p>
            <ul id="note-players" class="note-players"></ul>
            <label for="notes-free">Notes libres</label>
            <textarea id="notes-free" rows="6" placeholder="ex : Bob a défendu Chloé trop vite…"></textarea>
          </div>
        </div>
        <div id="tab-log" class="tab-panel hidden">
          <ul id="log" class="feed"></ul>
        </div>
      </aside>
    </div>

    <footer class="voicebar">
      <button id="mic" class="voice-btn" title="Micro">🎙️<span>Micro</span></button>
      <button id="deafen" class="voice-btn" title="Son">🔊<span>Son</span></button>
      <div id="speakers" class="speakers"></div>
      <div id="voice-status" class="voice-status"></div>
    </footer>
  </main>

  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="socket.io/socket.io.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
